<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}axisplit{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a class="brand" href="/">axisplit</a>
    <span class="who">{% if who %}{{ who }}{% else %}<a href="/claim?next={{ request.url.path }}">claim name</a>{% endif %}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
