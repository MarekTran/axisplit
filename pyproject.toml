[tool.uv]
package = true

[project]
name = "axisplit"
version = "0.1.0"
description = "Receipt-OCR powered bill splitting for groups"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "greenlet>=3.1",
    "pillow>=11.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
bench = [
    "httpx>=0.27",
    "openai>=1.55",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]  # tests import the bench package from the repo root

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001", "UP017", "FURB167"]  # B008: FastAPI Depends-in-defaults idiom

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC210", "ASYNC220", "ASYNC251", "SIM115", "EXE001"]
