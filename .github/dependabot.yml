# Weekly pull requests that update the Python lock file and the workflows' actions, one per
# ecosystem. The Nix inputs (flake.lock) aren't covered: `nix flake update` updates them.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
