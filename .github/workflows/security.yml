# Leaked secrets, known vulnerabilities and risky code: on every pull request and push to main, and
# weekly, as new CVEs are published against dependencies that haven't changed. gitleaks and trivy
# come from the flake's nixpkgs, the versions a contributor runs locally.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"  # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every commit, not only the last
      - uses: cachix/install-nix-action@v31
      - run: nix run --inputs-from . nixpkgs#gitleaks -- git --redact --no-banner --verbose .

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Python dependencies (uv.lock), the Dockerfile and secrets in the tree. Fails on high and
      # critical findings that have a fix. Nix-built packages are out of its reach: they're
      # updated with flake.lock.
      - run: >-
          nix run --inputs-from . nixpkgs#trivy -- fs --scanners vuln,misconfig,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-version-check .

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # findings go to the Security tab and the pull request
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
