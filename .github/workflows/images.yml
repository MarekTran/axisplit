# The Docker images, from the Dockerfile's two targets, published as :latest on every push to
# main: ghcr.io/marektran/axisplit and ghcr.io/marektran/axisplit-decide (x86_64). Pull requests
# that change how they're built build them without publishing.
name: Images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - flake.nix
      - flake.lock
      - nix/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One builder stage for both: the second build reuses it from the first.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: decide
          tags: ghcr.io/marektran/axisplit-decide:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: ${{ env.PUBLISH == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          tags: ghcr.io/marektran/axisplit:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: ${{ env.PUBLISH == 'true' }}
